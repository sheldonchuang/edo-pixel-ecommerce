<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>熱血江戶一番街 - 8-Bit 復古電商原型</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Pixel Fonts (DotGothic16 支援漢字與日文像素，Press Start 2P 支援經典英數) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0b12;
      font-family: 'DotGothic16', monospace;
    }
    .font-nes {
      font-family: 'Press Start 2P', monospace;
    }
    /* 核心像素縮放技術：讓低解析度 3D 畫布呈現真 8-bit 顆粒感 */
    #game-canvas {
      image-rendering: -moz-crisp-edges;
      image-rendering: -webkit-crisp-edges;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      display: block;
    }
    /* 紅白機 NES 風格經典邊框 */
    .nes-box {
      background-color: #000;
      border: 4px solid #fff;
      box-shadow: 4px 4px 0px #000;
      position: relative;
    }
    .nes-box::after {
      content: '';
      position: absolute;
      top: -6px; left: -6px; right: -6px; bottom: -6px;
      border: 2px solid #000;
      pointer-events: none;
    }
    .nes-btn {
      background-color: #2b2b36;
      border: 3px solid #fff;
      color: #fff;
      transition: all 0.05s ease;
      cursor: pointer;
    }
    .nes-btn:hover {
      background-color: #d97706;
      border-color: #fef08a;
    }
    .nes-btn:active {
      transform: translate(2px, 2px);
    }
    /* 復古 CRT 掃描線效果 (微弱可切換) */
    .crt-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 20;
    }
    /* 閃爍動畫 */
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .blink {
      animation: blink 0.8s infinite;
    }
    /* 自訂捲軸 */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #111;
    }
    ::-webkit-scrollbar-thumb {
      background: #fff;
    }
  </style>

  <!-- Three.js ES Module Map -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body class="relative text-white">

  <!-- 3D 渲染畫布容器 -->
  <div id="canvas-container" class="relative w-full h-full overflow-hidden">
    <canvas id="game-canvas"></canvas>

  <!-- HUD 頂部狀態列 (任天堂風格 HP / 金幣 / 購物車) -->

  <!-- JavaScript 核心程式碼 -->
  <script type="module">
    import * as THREE from 'three';

    /* ==========================================================================
       1. 8-Bit Web Audio 合成音效系統 (無需外部 mp3 即可發出紅白機逼逼聲)
       ========================================================================== */
    class RetroAudio {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playBlip(freq = 440, type = 'square', duration = 0.06) {
        if (!this.enabled) return;
        this.init();
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch(e) {}
      }
      playPunch() {
        if (!this.enabled) return;
        this.init();
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(160, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.15);
        } catch(e) {}
      }
      playCoin() {
        if (!this.enabled) return;
        this.init();
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(987.77, now); // B5
          osc.frequency.setValueAtTime(1318.51, now + 0.08); // E6
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.35);
        } catch(e) {}
      }
      playFanfare() {
        if (!this.enabled) return;
        this.init();
        const notes = [523.25, 659.25, 783.99, 1046.50]; // C E G C
        notes.forEach((freq, idx) => {
          setTimeout(() => this.playBlip(freq, 'square', 0.12), idx * 100);
        });
      }
    }
    const audio = new RetroAudio();
    document.getElementById('btn-toggle-sound').addEventListener('click', (e) => {
      audio.enabled = !audio.enabled;
      e.target.innerText = audio.enabled ? '🔊 音效' : '🔇 靜音';
    });

    /* ==========================================================================
       2. 電商數據庫 (江戶商店、商品與折價券資料)
       ========================================================================== */
    const SHOP_DATA = {
      rice: {
        id: 'rice',
        name: '越後屋米糧鋪',
        icon: '🌾',
        speaker: '越後屋掌櫃',
        avatar: '👨‍🌾',
        intro: '客官好眼光！本店專營天下第一之越後新米與百年醬園古法仙貝，飢腸轆轆時最宜補充體力！',
        items: [
          { id: 'r1', name: '特選越後越光米 (5kg)', price: 380, image: '🌾', tag: '當季新穀', desc: '軟糯甘甜，炊飯香氣飄散十里。' },
          { id: 'r2', name: '江戶名物 備長炭烤醬油仙貝', price: 120, image: '🍘', tag: '茶點首選', desc: '脆爽十足，以純手工生醬油刷烤而成。' },
          { id: 'r3', name: '佐渡島百年藏造赤味噌', price: 180, image: '🥣', tag: '特產推薦', desc: '風味濃厚甘醇，煮湯或拌飯皆一絕。' }
        ]
      },
      weapon: {
        id: 'weapon',
        name: '備前鍛冶裝備鋪',

        speaker: '刀匠 兼光',
        avatar: '👺',
        intro: '天下動盪，浪人不可一日無防身利器！我這有剛出爐的好鋼與現代潮人必備衣甲！',
        items: [
          { id: 'w1', name: '妖刀村正 偽裝自動雨傘', price: 650, image: '☂️', tag: '熱銷第一', desc: '握柄仿鯊魚皮柄捲，雨天抽出氣勢如虹！' },
          { id: 'w2', name: '新選組誠字印花 復古純棉連帽衫', price: 890, image: '🥋', tag: '潮品限量', desc: '淺蔥色山形紋，保暖防風且滿載熱血魂。' },
          { id: 'w3', name: '忍者煙幕 舒壓香薰蠟燭', price: 290, image: '🕯️', tag: '舒壓逸品', desc: '檜木與松針氣息，點燃瞬間如遁入黑夜。' }
        ]
      },
      tea: {
        id: 'tea',
        name: '浮世甘味茶房',
        icon: '🍵',
        speaker: '阿茶姑娘',
        avatar: '👧',
        intro: '一路辛苦了，請先進來喝杯溫潤的宇治玉露，嚐嚐今天早上現做的草莓生巧大福吧～',
        items: [
          { id: 't1', name: '宇治特級手採玉露綠茶 (100g)', price: 420, image: '🍵', tag: '回甘極品', desc: '茶湯翠綠如琉璃，初飲甘醇，回味無窮。' },
          { id: 't2', name: '富士山雪見 宇治抹茶大福 (6入)', price: 260, image: '🍡', tag: '每日現做', desc: '皮薄Q彈，爆漿抹茶甘納許微苦微甜。' },
          { id: 't3', name: '金箔櫻花落雁糖 伴手禮盒', price: 350, image: '🌸', tag: '贈禮名物', desc: '入口即化，點綴純金箔的宮廷級和菓子。' }
        ]

    };

    // 購物車與玩家狀態
    const gameState = {
      gold: 1500,
      hp: 100,
      cart: [],
      appliedCoupon: null,
      couponsFound: [],
      currentShopNear: null
    };

    /* ==========================================================================
       3. 像素貼圖生成器 (利用 2D Canvas 手動繪製 8-bit 質感材質)
       ========================================================================== */
    function createPixelTexture(drawFn, width = 32, height = 32) {
      const cvs = document.createElement('canvas');
      cvs.width = width;
      cvs.height = height;
      const ctx = cvs.getContext('2d');
      drawFn(ctx, width, height);
      const texture = new THREE.CanvasTexture(cvs);
      texture.magFilter = THREE.NearestFilter;
      texture.minFilter = THREE.NearestFilter;
      texture.generateMipmaps = false;
      return texture;
    }

    // 街道石板路像素貼圖
    const roadTexture = createPixelTexture((ctx, w, h) => {
      ctx.fillStyle = '#423d38';
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = '#5c544c';
      for (let y = 0; y < h; y += 8) {
        for (let x = 0; x < w; x += 16) {
          const offset = (y % 16 === 0) ? 0 : 8;
          ctx.fillRect(x + offset + 1, y + 1, 14, 6);
          ctx.fillStyle = '#26221f';
          ctx.fillRect(x + offset, y + 7, 16, 1);
          ctx.fillRect(x + offset + 15, y, 1, 8);
          ctx.fillStyle = '#5c544c';
        }
      }
    }, 64, 64);
    roadTexture.wrapS = THREE.RepeatWrapping;
    roadTexture.wrapT = THREE.RepeatWrapping;
    roadTexture.repeat.set(12, 2);

    // 町屋木紋與格子窗貼圖
    const machiyaWallTexture = createPixelTexture((ctx, w, h) => {
      ctx.fillStyle = '#3a271d'; // 深木色
      ctx.fillRect(0, 0, w, h);
      // 木條紋
      ctx.fillStyle = '#22150e';
      for (let x = 0; x < w; x += 4) {
        ctx.fillRect(x, 0, 1, h);
      }
      // 白紙障子格子
      ctx.fillStyle = '#f5eedb';
      ctx.fillRect(4, 6, 24, 18);
      ctx.fillStyle = '#22150e';
      ctx.fillRect(4, 15, 24, 1);
      ctx.fillRect(16, 6, 1, 18);
    }, 32, 32);

    // 暖簾 (Noren) 貼圖
    function createNorenTexture(color, text) {
      return createPixelTexture((ctx, w, h) => {
        ctx.fillStyle = color;
        ctx.fillRect(0, 0, w, h);
        // 簾縫隙
        ctx.fillStyle = '#111';
        ctx.fillRect(w / 3 - 1, h / 2, 2, h / 2);
        ctx.fillRect((w * 2) / 3 - 1, h / 2, 2, h / 2);
        // 簾字
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 12px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, w / 2, h / 3);
      }, 32, 32);
    }

    // 木箱貼圖
    const crateTexture = createPixelTexture((ctx, w, h) => {
      ctx.fillStyle = '#b4783c';
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = '#613c17';
      ctx.strokeRect(1, 1, w - 2, h - 2);
      ctx.beginPath();
      ctx.moveTo(2, 2); ctx.lineTo(w - 2, h - 2);
      ctx.moveTo(w - 2, 2); ctx.lineTo(2, h - 2);
      ctx.lineWidth = 2;
      ctx.stroke();
    }, 16, 16);

    /* ==========================================================================
       4. Three.js 核心場景與熱血物語 2.5D 視角配置
       ========================================================================== */
    const canvas = document.getElementById('game-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
    
    // 渲染設定：設定低原生解析度 (例如 480x270)，透過 CSS 自動近鄰縮放，達到原生 FC 點陣顆粒
    const INTERNAL_WIDTH = 480;
    const INTERNAL_HEIGHT = 270;
    renderer.setSize(INTERNAL_WIDTH, INTERNAL_HEIGHT, false);
    renderer.setPixelRatio(1);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.BasicShadowMap; // 像素風硬邊陰影

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#14142b');
    scene.fog = new THREE.Fog('#14142b', 20, 50);

    // 鏡頭視角：帶俯角的 2.5D 斜向橫向捲軸 (經典 River City Ransom 視角)
    const camera = new THREE.PerspectiveCamera(38, INTERNAL_WIDTH / INTERNAL_HEIGHT, 0.1, 100);
    // 固定傾角與高度
    const CAMERA_OFFSET_Y = 5.2;
    const CAMERA_OFFSET_Z = 9.5;
    camera.position.set(0, CAMERA_OFFSET_Y, CAMERA_OFFSET_Z);
    camera.lookAt(0, 1.2, 0);

    // 燈光：復古夜晚暖黃燈籠光 + 環境月光
    const ambientLight = new THREE.AmbientLight('#5c608a', 1.2);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight('#ffe8b0', 1.6);
    dirLight.position.set(10, 15, 8);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 512;
    dirLight.shadow.mapSize.height = 512;
    dirLight.shadow.camera.near = 0.5;
    dirLight.shadow.camera.far = 35;
    dirLight.shadow.camera.left = -15;
    dirLight.shadow.camera.right = 15;
    dirLight.shadow.camera.top = 10;
    dirLight.shadow.camera.bottom = -10;
    scene.add(dirLight);

    /* ==========================================================================
       5. 場景元素建置（街道、町屋商店、燈籠、可打破木箱）
       ========================================================================== */
    // 街道地面 (Z 軸 -2.5 ~ 2.5 允許玩家前後走動，X 軸為長街)
    const groundGeo = new THREE.PlaneGeometry(60, 7);
    const groundMat = new THREE.MeshLambertMaterial({ map: roadTexture });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.set(0, 0, 0);
    ground.receiveShadow = true;
    scene.add(ground);

    // 江戶商店陣列
    const shopsInScene = [];

    function buildMachiyaShop(xPos, shopKey, norenColor, norenText) {
      const group = new THREE.Group();
      group.position.set(xPos, 0, -3.2);

      // 主屋身
      const houseGeo = new THREE.BoxGeometry(4.2, 3.2, 2.5);
      const houseMat = new THREE.MeshLambertMaterial({ map: machiyaWallTexture });
      const house = new THREE.Mesh(houseGeo, houseMat);
      house.position.y = 1.6;
      house.castShadow = true;
      house.receiveShadow = true;
      group.add(house);

      // 黑瓦斜屋頂
      const roofGeo = new THREE.ConeGeometry(3.4, 1.2, 4);
      const roofMat = new THREE.MeshLambertMaterial({ color: '#1e2029' });
      const roof = new THREE.Mesh(roofGeo, roofMat);
      roof.position.set(0, 3.7, 0);
      roof.rotation.y = Math.PI / 4;
      roof.scale.set(1.4, 1, 0.9);
      roof.castShadow = true;
      group.add(roof);

      // 暖簾 (Noren)
      const norenTex = createNorenTexture(norenColor, norenText);
      const norenGeo = new THREE.PlaneGeometry(2.4, 0.9);
      const norenMat = new THREE.MeshBasicMaterial({ map: norenTex, transparent: true });
      const noren = new THREE.Mesh(norenGeo, norenMat);
      noren.position.set(0, 1.7, 1.28);
      group.add(noren);

      // 門口發光紅燈籠 (Chouchin)
      const lanternGeo = new THREE.CylinderGeometry(0.2, 0.2, 0.5, 6);
      const lanternMat = new THREE.MeshBasicMaterial({ color: '#ff3b30' });
      const lantern = new THREE.Mesh(lanternGeo, lanternMat);
      lantern.position.set(1.6, 2.0, 1.4);
      group.add(lantern);

      // 燈籠點光源
      const lanternLight = new THREE.PointLight('#ff8844', 1.2, 5);
      lanternLight.position.set(1.6, 2.0, 1.5);
      group.add(lanternLight);

      // 互動觸發提示方塊 (頭頂驚嘆號)
      const hintGeo = new THREE.PlaneGeometry(0.6, 0.6);
      const hintTex = createPixelTexture((ctx, w, h) => {
        ctx.fillStyle = '#ffcc00';
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = '#000000';
        ctx.font = 'bold 22px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('商', w / 2, h / 2);
      }, 32, 32);
      const hintMat = new THREE.MeshBasicMaterial({ map: hintTex, transparent: true });
      const hintMesh = new THREE.Mesh(hintGeo, hintMat);
      hintMesh.position.set(0, 4.3, 0);
      group.add(hintMesh);

      scene.add(group);

      shopsInScene.push({
        key: shopKey,
        data: SHOP_DATA[shopKey],
        position: new THREE.Vector3(xPos, 0, -1.8),
        hintMesh: hintMesh
      });
    }

    // 建立三家風格町屋
    buildMachiyaShop(-8, 'rice', '#8b5a2b', '米');
    buildMachiyaShop(0, 'weapon', '#8b2500', '武');
    buildMachiyaShop(8, 'tea', '#2e5b3f', '茶');

    // 可打破的木箱 (Crates)
    const crates = [];
    function spawnCrate(x, z) {
      const geo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
      const mat = new THREE.MeshLambertMaterial({ map: crateTexture });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, 0.4, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      crates.push({
        mesh: mesh,
        alive: true,
        x: x,
        z: z
      });
    }
    spawnCrate(-4, 0.8);
    spawnCrate(4, -0.6);
    spawnCrate(13, 0.5);

    // 木箱擊破後的碎片微粒
    const debrisList = [];
    function breakCrate(crate) {
      crate.alive = false;
      scene.remove(crate.mesh);
      audio.playPunch();

      // 碎裂小方塊
      for (let i = 0; i < 8; i++) {
        const dGeo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
        const dMat = new THREE.MeshLambertMaterial({ color: '#b4783c' });
        const dMesh = new THREE.Mesh(dGeo, dMat);
        dMesh.position.set(
          crate.x + (Math.random() - 0.5) * 0.4,
          0.4 + (Math.random() - 0.5) * 0.4,
          crate.z + (Math.random() - 0.5) * 0.4
        );
        scene.add(dMesh);
        debrisList.push({
          mesh: dMesh,
          vx: (Math.random() - 0.5) * 0.1,
          vy: Math.random() * 0.15 + 0.08,
          vz: (Math.random() - 0.5) * 0.1,
          life: 30
        });
      }

      // 掉落獎勵：金幣或折價券
      setTimeout(() => {
        audio.playCoin();
        const dropType = Math.random() > 0.4 ? 'gold' : 'coupon';
        if (dropType === 'gold') {
          const award = 100;
          gameState.gold += award;
          updateHUD();
          showToast(`💰 擊破木箱！獲得 ${award} 文錢！`);
        } else {
          const code = 'EDO88';
          gameState.couponsFound.push(code);
          showToast(`🎟️ 尋獲神秘密技卷軸！折扣碼：【 ${code} 】`);
        }
      }, 100);
    }

    /* ==========================================================================
       6. 玩家角色建置（Voxel 8-bit 熱血浪人模型與骨骼晃動動畫）
       ========================================================================== */
    const playerGroup = new THREE.Group();
    playerGroup.position.set(-6, 0, 0);

    // 身體 (外袍和服)
    const bodyGeo = new THREE.BoxGeometry(0.7, 0.8, 0.5);
    const bodyMat = new THREE.MeshLambertMaterial({ color: '#ffffff' }); // 熱血系列經典白制服/白和服
    const playerBody = new THREE.Mesh(bodyGeo, bodyMat);
    playerBody.position.y = 0.8;
    playerBody.castShadow = true;
    playerGroup.add(playerBody);

    // 頭部
    const headGeo = new THREE.BoxGeometry(0.6, 0.6, 0.55);
    const skinMat = new THREE.MeshLambertMaterial({ color: '#ffcc99' });
    const playerHead = new THREE.Mesh(headGeo, skinMat);
    playerHead.position.y = 1.5;
    playerHead.castShadow = true;
    playerGroup.add(playerHead);

    // 經典熱血紅頭帶 (Hachimaki)
    const bandGeo = new THREE.BoxGeometry(0.64, 0.14, 0.58);
    const bandMat = new THREE.MeshLambertMaterial({ color: '#e60012' });
    const playerBand = new THREE.Mesh(bandGeo, bandMat);
    playerBand.position.y = 1.62;
    playerGroup.add(playerBand);

    // 頭帶飄帶尾巴
    const tailGeo = new THREE.BoxGeometry(0.3, 0.12, 0.05);
    const playerBandTail = new THREE.Mesh(tailGeo, bandMat);
    playerBandTail.position.set(-0.35, 1.62, -0.28);
    playerGroup.add(playerBandTail);

    // 雙腿
    const legGeo = new THREE.BoxGeometry(0.24, 0.45, 0.3);
    const legMat = new THREE.MeshLambertMaterial({ color: '#1a1a24' });
    const legL = new THREE.Mesh(legGeo, legMat);
    legL.position.set(-0.18, 0.22, 0);
    legL.castShadow = true;
    playerGroup.add(legL);

    const legR = new THREE.Mesh(legGeo, legMat);
    legR.position.set(0.18, 0.22, 0);
    legR.castShadow = true;
    playerGroup.add(legR);

    // 拳頭（出拳時伸出）
    const fistGeo = new THREE.BoxGeometry(0.25, 0.25, 0.25);
    const fistMesh = new THREE.Mesh(fistGeo, skinMat);
    fistMesh.position.set(0.5, 0.8, 0.2);
    fistMesh.visible = false;
    playerGroup.add(fistMesh);

    scene.add(playerGroup);

    /* ==========================================================================
       7. NPC 行人系統（在街道閒晃的町民）
       ========================================================================== */
    const npcs = [];
    function createNPC(x, z, color, name, quote) {
      const npcGrp = new THREE.Group();
      npcGrp.position.set(x, 0, z);

      const b = new THREE.Mesh(bodyGeo, new THREE.MeshLambertMaterial({ color: color }));
      b.position.y = 0.8;
      b.castShadow = true;
      npcGrp.add(b);

      const h = new THREE.Mesh(headGeo, skinMat);
      h.position.y = 1.5;
      npcGrp.add(h);

      scene.add(npcGrp);
      npcs.push({
        group: npcGrp,
        name: name,
        quote: quote,
        speed: (Math.random() * 0.02 + 0.01) * (Math.random() > 0.5 ? 1 : -1),
        minX: x - 4,
        maxX: x + 4
      });
    }
    createNPC(-2, 1.2, '#3b82f6', '行商人', '聽說備前屋新進了一批極品雨傘，雨天防身一流！');
    createNPC(5, -0.8, '#a855f7', '醉漢武士', '嗝... 這條街的玉露茶點... 真是人間極品...！');

    /* ==========================================================================
       8. 玩家控制與遊戲邏輯循環 (Keyboard & Virtual Keys)
       ========================================================================== */
    const keys = {
      up: false, down: false, left: false, right: false,
      attack: false, interact: false
    };

    window.addEventListener('keydown', (e) => {
      if (document.activeElement.tagName === 'INPUT') return;
      switch(e.code) {
        case 'KeyW': case 'ArrowUp': keys.up = true; break;
        case 'KeyS': case 'ArrowDown': keys.down = true; break;
        case 'KeyA': case 'ArrowLeft': keys.left = true; break;
        case 'KeyD': case 'ArrowRight': keys.right = true; break;
        case 'Space': case 'KeyJ':
          e.preventDefault();
          triggerAttack();
          break;
        case 'KeyE': case 'Enter':
          e.preventDefault();
          triggerInteract();
          break;
        case 'Escape':
          closeAllModals();
          break;
      }
    });

    window.addEventListener('keyup', (e) => {
      switch(e.code) {
        case 'KeyW': case 'ArrowUp': keys.up = false; break;
        case 'KeyS': case 'ArrowDown': keys.down = false; break;
        case 'KeyA': case 'ArrowLeft': keys.left = false; break;
        case 'KeyD': case 'ArrowRight': keys.right = false; break;
      }
    });

    // 虛擬鍵盤綁定
    const bindTouch = (id, keyName) => {
      const btn = document.getElementById(id);
      btn.addEventListener('pointerdown', (e) => { e.preventDefault(); keys[keyName] = true; });
      btn.addEventListener('pointerup', (e) => { e.preventDefault(); keys[keyName] = false; });
      btn.addEventListener('pointerleave', (e) => { e.preventDefault(); keys[keyName] = false; });
    };
    bindTouch('vkey-up', 'up');
    bindTouch('vkey-down', 'down');
    bindTouch('vkey-left', 'left');
    bindTouch('vkey-right', 'right');
    document.getElementById('vkey-attack').addEventListener('click', triggerAttack);
    document.getElementById('vkey-action').addEventListener('click', triggerInteract);

    // 出拳動作邏輯
    let isAttacking = false;
    function triggerAttack() {
      if (isAttacking) return;
      isAttacking = true;
      audio.playPunch();
      fistMesh.visible = true;

      // 檢查是否命中附近的木箱
      const punchRange = 1.2;
      crates.forEach(c => {
        if (!c.alive) return;
        const dist = Math.hypot(playerGroup.position.x - c.x, playerGroup.position.z - c.z);
        if (dist < punchRange) {
          breakCrate(c);
        }
      });

      setTimeout(() => {
        fistMesh.visible = false;
        isAttacking = false;
      }, 160);
    }

    // 調查 / 互動邏輯 (進入商店或與 NPC 交談)
    function triggerInteract() {
      // 若已有對話框開啟，按 E 推進或關閉
      const dialogModal = document.getElementById('dialog-modal');
      if (!dialogModal.classList.contains('hidden')) {
        openShopView(gameState.currentShopNear.data);
        return;
      }

      // 檢查附近商店
      if (gameState.currentShopNear) {
        audio.playBlip(600, 'square', 0.1);
        openDialog(gameState.currentShopNear.data);
      }
    }

    /* ==========================================================================
       9. UI 交互系統 (對話框、商品清單、購物車、Toast)
       ========================================================================== */
    const actionHint = document.getElementById('action-hint');
    const hintText = document.getElementById('hint-text');

    function updateHUD() {
      document.getElementById('player-gold').innerText = `${gameState.gold.toLocaleString()} 文`;
      const cartCount = gameState.cart.reduce((sum, item) => sum + item.qty, 0);
      document.getElementById('cart-badge').innerText = cartCount;
    }

    function showToast(msg) {
      const toast = document.createElement('div');
      toast.className = 'nes-box px-4 py-2 bg-black text-yellow-300 text-xs tracking-wider transition-all duration-300';
      toast.innerText = msg;
      document.getElementById('toast-container').appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 400);
      }, 3000);
    }

    // 對話視窗控制
    function openDialog(shopData) {
      const dialog = document.getElementById('dialog-modal');
      document.getElementById('dialog-avatar').innerText = shopData.avatar;
      document.getElementById('dialog-speaker').innerText = `【${shopData.name}】${shopData.speaker}`;
      document.getElementById('dialog-content').innerText = shopData.intro;
      dialog.classList.remove('hidden');
    }

    document.getElementById('btn-close-dialog').addEventListener('click', () => {
      document.getElementById('dialog-modal').classList.add('hidden');
    });

    document.getElementById('btn-view-shop-goods').addEventListener('click', () => {
      document.getElementById('dialog-modal').classList.add('hidden');
      if (gameState.currentShopNear) {
        openShopView(gameState.currentShopNear.data);
      }
    });

    // 商店商品清單控制
    function openShopView(shopData) {
      document.getElementById('shop-icon').innerText = shopData.icon;
      document.getElementById('shop-title').innerText = shopData.name;
      document.getElementById('shop-subtitle').innerText = shopData.intro;

      const container = document.getElementById('shop-items-container');
      container.innerHTML = '';

      shopData.items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'nes-box p-3 bg-neutral-900 flex flex-col justify-between hover:border-yellow-400';
        card.innerHTML = `
          <div>
            <div class="flex justify-between items-start">
              <span class="text-3xl p-2 bg-black border border-gray-700">${item.image}</span>
              <span class="text-[10px] bg-amber-900 text-yellow-200 px-1.5 py-0.5 border border-amber-600">${item.tag}</span>
            </div>
            <h3 class="font-bold text-sm mt-2 text-white">${item.name}</h3>
            <p class="text-xs text-gray-400 mt-1 leading-relaxed">${item.desc}</p>
          </div>
          <div class="mt-4 pt-2 border-t border-gray-700 flex justify-between items-center">
            <span class="text-yellow-400 font-bold text-sm">${item.price} 文</span>
            <button class="btn-buy-item nes-btn px-2.5 py-1 text-xs bg-yellow-600 font-bold" data-id="${item.id}">
              購入 ＋
            </button>
          </div>
        `;

        card.querySelector('.btn-buy-item').addEventListener('click', () => {
          addToCart(item);
        });

        container.appendChild(card);
      });

      document.getElementById('shop-modal').classList.remove('hidden');
      audio.playBlip(800, 'square', 0.08);
    }

    function addToCart(item) {
      const existing = gameState.cart.find(i => i.id === item.id);
      if (existing) {
        existing.qty += 1;
      } else {
        gameState.cart.push({ ...item, qty: 1 });
      }
      audio.playCoin();
      updateHUD();
      showToast(`已將【${item.name}】放入行囊錢袋！`);
    }

    document.getElementById('btn-close-shop').addEventListener('click', () => {
      document.getElementById('shop-modal').classList.add('hidden');
    });

    document.getElementById('btn-shop-to-cart').addEventListener('click', () => {
      document.getElementById('shop-modal').classList.add('hidden');
      openCartView();
    });

    // 購物車視窗控制
    function openCartView() {
      const container = document.getElementById('cart-items-list');
      container.innerHTML = '';

      if (gameState.cart.length === 0) {
        container.innerHTML = '<div class="py-12 text-center text-gray-500 text-sm">您的行囊錢袋空空如也，快去各家町屋搜羅好貨吧！</div>';
      } else {
        gameState.cart.forEach(item => {
          const row = document.createElement('div');
          row.className = 'py-3 flex justify-between items-center';
          row.innerHTML = `
            <div class="flex items-center gap-3">
              <span class="text-2xl">${item.image}</span>
              <div>
                <div class="font-bold text-sm">${item.name}</div>
                <div class="text-xs text-gray-400">${item.price} 文 × ${item.qty}</div>
              </div>
            </div>
            <div class="flex items-center gap-3">
              <span class="font-bold text-yellow-300 text-sm">${item.price * item.qty} 文</span>
              <button class="btn-remove-item nes-btn px-2 py-0.5 text-xs bg-red-800" data-id="${item.id}">✕</button>
            </div>
          `;
          row.querySelector('.btn-remove-item').addEventListener('click', () => {
            gameState.cart = gameState.cart.filter(i => i.id !== item.id);
            openCartView();
            updateHUD();
          });
          container.appendChild(row);
        });
      }

      calculateCartTotal();
      document.getElementById('cart-modal').classList.remove('hidden');
      audio.playBlip(700, 'square', 0.08);
    }

    function calculateCartTotal() {
      let total = gameState.cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
      if (gameState.appliedCoupon === 'EDO88') {
        total = Math.round(total * 0.88);
        document.getElementById('cart-discount-info').classList.remove('hidden');
      } else {
        document.getElementById('cart-discount-info').classList.add('hidden');
      }
      document.getElementById('cart-total-price').innerText = `${total.toLocaleString()} 文`;
      return total;
    }

    document.getElementById('btn-apply-coupon').addEventListener('click', () => {
      const val = document.getElementById('coupon-input').value.trim().toUpperCase();
      if (val === 'EDO88') {
        gameState.appliedCoupon = 'EDO88';
        audio.playFanfare();
        calculateCartTotal();
        showToast('🎉 密技生效！已套用全單 88 折優惠！');
      } else {
        audio.playBlip(150, 'sawtooth', 0.2);
        showToast('❌ 無效的密技代碼');
      }
    });

    document.getElementById('btn-checkout').addEventListener('click', () => {
      const total = calculateCartTotal();
      if (gameState.cart.length === 0) {
        showToast('錢袋沒有任何商品可交割！');
        return;
      }
      if (gameState.gold < total) {
        audio.playBlip(120, 'sawtooth', 0.3);
        showToast('文錢不足！請多打碎街上木箱尋寶！');
        return;
      }

      // 扣款結帳成功
      gameState.gold -= total;
      gameState.cart = [];
      updateHUD();
      document.getElementById('cart-modal').classList.add('hidden');
      audio.playFanfare();
      showToast('🏮 恭喜交割成功！店家已安排飛腳快遞火速送達！');
    });

    document.getElementById('btn-open-cart').addEventListener('click', openCartView);
    document.getElementById('btn-close-cart').addEventListener('click', () => {
      document.getElementById('cart-modal').classList.add('hidden');
    });

    function closeAllModals() {
      document.getElementById('dialog-modal').classList.add('hidden');
      document.getElementById('shop-modal').classList.add('hidden');
      document.getElementById('cart-modal').classList.add('hidden');
    }

    /* ==========================================================================
       10. 遊戲主循環 (Render Loop & Animation)
       ========================================================================== */
    const playerSpeed = 0.085;
    let walkCycle = 0;

    function animate() {
      requestAnimationFrame(animate);

      // 玩家移動處理
      let moveX = 0;
      let moveZ = 0;

      if (keys.left) moveX -= 1;
      if (keys.right) moveX += 1;
      if (keys.up) moveZ -= 1;
      if (keys.down) moveZ += 1;

      const isMoving = (moveX !== 0 || moveZ !== 0);

      if (isMoving) {
        // 正規化移動向量
        const len = Math.hypot(moveX, moveZ);
        playerGroup.position.x += (moveX / len) * playerSpeed;
        playerGroup.position.z += (moveZ / len) * playerSpeed;

        // 限制移動範圍 (街道邊界)
        playerGroup.position.x = THREE.MathUtils.clamp(playerGroup.position.x, -25, 25);
        playerGroup.position.z = THREE.MathUtils.clamp(playerGroup.position.z, -2.4, 2.2);

        // 面對方向轉向
        if (moveX !== 0) {
          playerGroup.scale.x = moveX > 0 ? 1 : -1;
        }

        // 雙腿晃動走路動畫 (熱血物語經典踩步)
        walkCycle += 0.28;
        legL.position.y = 0.22 + Math.sin(walkCycle) * 0.12;
        legR.position.y = 0.22 - Math.sin(walkCycle) * 0.12;
        playerBody.position.y = 0.8 + Math.abs(Math.sin(walkCycle)) * 0.04;
        playerBandTail.rotation.z = Math.sin(walkCycle) * 0.3;
      } else {
        // 站立待機微幅呼吸
        walkCycle += 0.04;
        playerBody.position.y = 0.8 + Math.sin(walkCycle) * 0.02;
        legL.position.y = 0.22;
        legR.position.y = 0.22;
      }

      // 相機跟隨玩家（X 軸平滑跟隨，固定 Y、Z 軸維持 2.5D 角度）
      camera.position.x = THREE.MathUtils.lerp(camera.position.x, playerGroup.position.x, 0.08);

      // NPC 巡邏移動
      npcs.forEach(npc => {
        npc.group.position.x += npc.speed;
        if (npc.group.position.x > npc.maxX || npc.group.position.x < npc.minX) {
          npc.speed = -npc.speed;
        }
      });

      // 木箱碎片物理模擬
      for (let i = debrisList.length - 1; i >= 0; i--) {
        const d = debrisList[i];
        d.mesh.position.x += d.vx;
        d.mesh.position.y += d.vy;
        d.mesh.position.z += d.vz;
        d.vy -= 0.01; // 重力
        d.mesh.rotation.x += 0.1;
        d.life--;
        if (d.mesh.position.y <= 0.1) {
          d.mesh.position.y = 0.1;
          d.vy = -d.vy * 0.4;
        }
        if (d.life <= 0) {
          scene.remove(d.mesh);
          debrisList.splice(i, 1);
        }
      }

      // 檢查玩家與商店距離，觸發提示
      let nearShop = null;
      shopsInScene.forEach(shop => {
        const dist = Math.hypot(playerGroup.position.x - shop.position.x, playerGroup.position.z - shop.position.z);
        // 驚嘆號上下懸浮旋轉
        shop.hintMesh.position.y = 4.3 + Math.sin(walkCycle * 2) * 0.15;
        shop.hintMesh.rotation.y += 0.03;

        if (dist < 2.5) {
          nearShop = shop;
        }
      });

      gameState.currentShopNear = nearShop;
      if (nearShop) {
        actionHint.style.opacity = '1';
        hintText.innerText = `進入【${nearShop.data.name}】`;
      } else {
        actionHint.style.opacity = '0';
      }

      renderer.render(scene, camera);
    }

    // 視窗響應縮放
    window.addEventListener('resize', () => {
      // 保持內部解析度不變，透過 CSS 縮放拉伸填滿視窗並維持像素網格
    });

    // 初始化狀態
    updateHUD();
    animate();
  </script>
</body>
</html>
